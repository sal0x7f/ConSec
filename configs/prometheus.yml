global:
  scrape_interval: 15s

rule_files:
  - '/etc/prometheus/honeypot_alert_rules.yml'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
  
  - job_name: 'honeypot'
    static_configs:
      - targets: ['172.20.0.4:9445']
    metrics_path: '/metrics'
    scrape_interval: 15s